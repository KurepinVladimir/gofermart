run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet
    - staticcheck
    - ineffassign
    - gofmt
    - goimports
    - revive
    - errcheck
    - gocritic

issues:
  exclude-use-default: false
  max-same-issues: 0
  max-issues-per-linter: 0

linters-settings:
  revive:
    rules:
      - name: exported
        severity: warning
      - name: if-return
      - name: increment-decrement
