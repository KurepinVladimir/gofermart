name: lint-and-test

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      # Используем ту же версию Go, что прописана в go.mod
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # КРИТИЧНО: подтягиваем модули до запуска линтера,
      # иначе typecheck видит импорты как "undefined"
      - name: Go mod download
        run: go mod download

       # Можно вывести ключевые импорты для отладки (по желанию)
       - name: Debug: show key imports
         run: |
           sed -n '1,60p' internal/app/server.go || true
           sed -n '1,60p' internal/auth/jwt.go || true
           sed -n '1,60p' internal/auth/service.go || true
           sed -n '1,60p' internal/repository/postgres.go || true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60.1
          # отключаем кэш, чтобы не тянулся старый стейт
          skip-cache: true
          args: --timeout=5m

      - name: Run golangci-lint
        run: golangci-lint run ./...

  test:
    name: go test
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go mod download
        run: go mod download
      - name: Unit tests
        run: go test ./... -race -count=1
